<svg width="900" height="1500" viewBox="0 0 900 1500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="1500" fill="#FFFFFF"/>
  <text x="450" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#26215C">AI-Based Transport &amp; Fleet Management — Process Flow</text>

  <!-- 1 Customer request -->
  <rect x="330" y="80" width="240" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#26215C">Customer transport request</text>
  <line x1="450" y1="130" x2="450" y2="160" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2 Owner receives booking -->
  <rect x="300" y="160" width="300" height="50" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="450" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0C447C">Owner receives booking</text>
  <line x1="450" y1="210" x2="450" y2="240" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 3 Availability checks -->
  <rect x="240" y="240" width="180" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="330" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0C447C">Check vehicle</text>
  <text x="330" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0C447C">availability</text>

  <rect x="480" y="240" width="180" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="570" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0C447C">Check driver</text>
  <text x="570" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0C447C">availability</text>

  <line x1="330" y1="300" x2="420" y2="335" stroke="#5F5E5A" stroke-width="1.2"/>
  <line x1="570" y1="300" x2="480" y2="335" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="330" y1="300" x2="330" y2="335" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4 AI analyzes -->
  <rect x="230" y="335" width="440" height="140" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">AI analyzes</text>
  <text x="450" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Route • Distance • Traffic</text>
  <text x="450" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Load • Fuel requirement</text>
  <text x="450" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Vehicle condition</text>
  <line x1="450" y1="475" x2="450" y2="505" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 5 Recommendation -->
  <rect x="270" y="505" width="360" height="50" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="450" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#085041">Recommended driver + vehicle + route</text>
  <line x1="450" y1="555" x2="450" y2="585" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 6 Owner assigns -->
  <rect x="300" y="585" width="300" height="50" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="450" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0C447C">Owner assigns trip</text>
  <line x1="450" y1="635" x2="450" y2="665" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 7 Driver notified -->
  <rect x="300" y="665" width="300" height="50" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="450" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0C447C">Driver receives notification</text>
  <line x1="450" y1="715" x2="450" y2="745" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 8 Trip starts -->
  <rect x="330" y="745" width="240" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="450" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C2C2A">Trip starts</text>
  <line x1="450" y1="795" x2="450" y2="825" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 9 GPS telemetry -->
  <rect x="270" y="825" width="360" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="450" y="852" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0C447C">GPS sends live location</text>
  <text x="450" y="872" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0C447C">Backend processes telemetry</text>
  <line x1="450" y1="895" x2="450" y2="925" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 10 AI monitors -->
  <rect x="220" y="925" width="460" height="150" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="950" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#26215C">AI monitors</text>
  <text x="450" y="975" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Route deviation • Driver behavior</text>
  <text x="450" y="995" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Fuel efficiency • ETA</text>
  <text x="450" y="1015" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Vehicle health</text>
  <line x1="450" y1="1075" x2="450" y2="1105" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 11 Alerts -->
  <rect x="270" y="1105" width="360" height="50" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="450" y="1135" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#633806">Alerts sent to owner + driver</text>
  <line x1="450" y1="1155" x2="450" y2="1185" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 12 Trip completed -->
  <rect x="330" y="1185" width="240" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="450" y="1215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C2C2A">Trip completed</text>
  <line x1="450" y1="1235" x2="450" y2="1265" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 13 Costs calculated -->
  <rect x="270" y="1265" width="360" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="450" y="1290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#085041">Revenue + fuel + maintenance</text>
  <text x="450" y="1308" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#085041">costs calculated</text>
  <line x1="450" y1="1325" x2="450" y2="1355" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 14 Profitability -->
  <rect x="270" y="1355" width="360" height="50" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="450" y="1385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#085041">Profitability analysis</text>
  <line x1="450" y1="1405" x2="450" y2="1435" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 15 AI recommendations -->
  <rect x="270" y="1435" width="360" height="50" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="450" y="1465" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#26215C">AI generates recommendations</text>
</svg>